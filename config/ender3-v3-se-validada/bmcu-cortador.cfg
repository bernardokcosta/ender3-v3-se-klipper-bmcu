[gcode_macro _BMCU_ENDER_CORTADOR_AJUSTES]
variable_habilitado: 0
variable_calibrado: 0
variable_servo: "bmcu_cortador"
variable_angulo_recolhido: 0.0
variable_angulo_acionado: 90.0
variable_x_aproximacao: -9999.0
variable_x_corte: -9999.0
variable_y_corte: -9999.0
variable_z_minimo: 10.0
variable_alivio_z: 2.0
variable_curso_maximo_mm: 15.0
variable_deslocamento_f: 3000.0
variable_corte_f: 300.0
variable_espera_servo_ms: 500
variable_soltar_servo_recolhido: 0
variable_velocidade_recuo_f: 600.0
variable_velocidade_avanco_f: 240.0
variable_velocidade_purga_f: 180.0
variable_posicionamento_paralelo: 1
gcode:
  {action_respond_info("Perfil do cortador; medir posicoes e testar antes de habilitar.")}

[gcode_macro CORTADOR_SERVO]
description: Testar somente o servo, com confirmacao de folga
gcode:
  BMCU_ENDER_SERVO {rawparams}

[gcode_macro TESTAR_CORTADOR]
description: Teste mecanico do cortador sem filamento
gcode:
  BMCU_ENDER_TESTAR_CORTADOR {rawparams}

[gcode_macro RESET_BMCU]
description: Confirmar caminho livre apos retirada manual, sem mover filamento
gcode:
  BMCU_ENDER_RESETAR CONFIRMAR={params.CONFIRMAR|default(0)|int}
