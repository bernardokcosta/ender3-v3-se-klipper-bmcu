[gcode_macro ENDER_INICIAR_MULTICOR]
gcode:
  {% set mesa = params.TEMP_MESA|float %}
  {% set bico = params.TEMP_BICO|float %}
  {% set ferramenta = params.FERRAMENTA|int %}
  G90
  M83
  M140 S{mesa}
  M104 S{[bico, 150.0]|min}
  M190 S{mesa}
  BED_MESH_CLEAR
  G28
  BED_MESH_PROFILE LOAD=default
  G1 Z10 F300
  M109 S{bico}
  SET_FILAMENT_SENSOR SENSOR=bmcu_entry ENABLE=1
  BMCU_TROCAR_ENDER TOOL={ferramenta} PURGAR_SE_CARREGADO=1
  G92 E0
  G1 Z5 F300

[gcode_macro ENDER_FINALIZAR_MULTICOR]
gcode:
  M400
  BMCU_PRINT_END MODE=KEEP CLEAR=1
  ENDER_FINALIZAR_IMPRESSAO
